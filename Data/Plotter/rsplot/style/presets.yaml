# Typography / line-weight presets layered over base.mplstyle, and figure size presets.
# Change values here to restyle every figure.

colours:
  ink: "#000000"              # main text: axis labels, title
  ink_secondary: "#595959"    # ticks, tick labels, legend, footnote, annotations
  grid: "#e3e3e3"
  palette: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
  greyscale: ["#000000", "#6e6e6e", "#a6a6a6", "#3a3a3a", "#8a8a8a", "#c4c4c4", "#202020", "#555555"]
  markers: ["o", "s", "^", "D", "v", "P", "X", "*"]
  linestyles: ["-", "--", ":", "-.", [0, [5, 1.5, 1, 1.5, 1, 1.5]], [0, [8, 2]], [0, [1, 3]], [0, [4, 1, 1, 1]]]
  sequential: ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"]
  diverging: ["#0d366b", "#256abf", "#6da7ec", "#cde2fb", "#f0efec", "#f6c9c5", "#ec8f8b", "#e34948", "#a12a2b"]

# usetex_preamble: font package used when "Use LaTeX for text" is on; match the thesis preamble.
styles:
  thesis:
    font_family: "TeX Gyre Termes"      # Times clone = the font pdfLaTeX's mathptmx uses
    sans: false
    usetex_preamble: '\usepackage{mathptmx}'
    sizes: {tick: 9, label: 10, legend: 9, annotation: 8, title: 11, footnote: 8, min: 7}
    line_width: 1.2
    axes_line_width: 0.6
    marker_size: 3.5
    capsize: 2.0
    tick_width: 0.6
  thesis_garamond:
    font_family: "EB Garamond"
    sans: false
    usetex_preamble: '\usepackage{ebgaramond}'
    sizes: {tick: 9, label: 10, legend: 9, annotation: 8, title: 11, footnote: 8, min: 7}
    line_width: 1.2
    axes_line_width: 0.6
    marker_size: 3.5
    capsize: 2.0
    tick_width: 0.6
  slides:
    font_family: "Fira Sans"
    sans: true
    usetex_preamble: '\usepackage[sfdefault]{FiraSans}'
    sizes: {tick: 14, label: 16, legend: 14, annotation: 12, title: 20, footnote: 12, min: 10}
    line_width: 2.2
    axes_line_width: 1.0
    marker_size: 6.5
    capsize: 3.0
    tick_width: 1.0
  poster:
    font_family: "Fira Sans"
    sans: true
    usetex_preamble: '\usepackage[sfdefault]{FiraSans}'
    sizes: {tick: 20, label: 24, legend: 20, annotation: 18, title: 28, footnote: 16, min: 14}
    line_width: 3.0
    axes_line_width: 1.4
    marker_size: 9
    capsize: 4.0
    tick_width: 1.4

# Figure sizes. `fraction` is of the settings value textwidth_cm (default 18.0);
# `width_cm` is absolute. Height = width * aspect unless set in the UI.
sizes:
  thesis_full:       {label: "Thesis full width",    fraction: 1.0,    aspect: 0.75, style: thesis}
  thesis_caption:    {label: "Thesis caption width", fraction: 0.8,    aspect: 0.75, style: thesis}
  thesis_two_thirds: {label: "Thesis 2/3 width",     fraction: 0.6667, aspect: 0.75, style: thesis}
  thesis_half:       {label: "Thesis half width",    fraction: 0.5,    aspect: 0.8,  style: thesis}
  slide_16_9:        {label: "Slide 16:9",           width_cm: 24.0,   aspect: 0.5625, style: slides}
  poster:            {label: "Poster (large fonts)", width_cm: 30.0,   aspect: 0.75, style: poster}
  custom:            {label: "Custom",               width_cm: 14.4,   aspect: 0.75, style: thesis}

thesis_max_height_cm: 22.0
